name: Cross-Branch Smart Unzipper

on:
  push:
    paths:
      - 'main.zip'
      - 'beta.zip'

jobs:
  unzip-and-route:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Bot Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Process Files Sequentially
        run: |
          # --- HANDLE MAIN.ZIP ---
          if [ -f main.zip ]; then
            echo "Found main.zip, routing to main branch..."
            mv main.zip ../main.zip
            git checkout main || git checkout -b main
            mv ../main.zip ./main.zip
            unzip -o main.zip
            rm main.zip
            git add .
            git commit -m "Automated extraction of main.zip" && git push origin main || echo "No changes for main"
            git checkout ${{ github.ref_name }}
          fi

          # --- HANDLE BETA.ZIP ---
          if [ -f beta.zip ]; then
            echo "Found beta.zip, routing to beta branch..."
            mv beta.zip ../beta.zip
            
            if git show-ref --verify --quiet refs/remotes/origin/beta; then
              git checkout beta
            else
              git checkout -b beta
            fi
            
            mv ../beta.zip ./beta.zip
            unzip -o beta.zip
            rm beta.zip
            git add .
            git commit -m "Automated extraction of beta.zip" && git push origin beta || echo "No changes for beta"
          fi
