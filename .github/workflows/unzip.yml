name: Unzip Web Assets

on:
  push:
    paths:
      - 'm.zip' # Triggers only when m.zip is uploaded or modified

jobs:
  unzip-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to commit unzipped files back to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip archive
        run: |
          # Unzips m.zip directly into the root repository folder
          unzip -o m.zip
          # Deletes the original zip file so it doesn't clutter your repo
          rm m.zip

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated unzip of m.zip assets"
          branch: main
          
